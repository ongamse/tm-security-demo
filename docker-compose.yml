version : '3'
services:
    jsc:
        image: joychou/jsc:latest
        command: ["java", "-Xdebug", "-Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=0.0.0.0:8000", "-jar", "jsc.jar"]
        ports:
            - "8080:8080"
            - "8000:8000"
        links:
            - j_mysql
        read_only: true
        tmpfs:
            - /tmp

    j_mysql:
        image: joychou/jsc_mysql:latest
        ports:
            - "3306:3306"
        read_only: true
        tmpfs:
            - /tmp
            - /var/run/mysqld
            - /var/lib/mysql


spring.datasource.url=jdbc:mysql://localhost:3306/java_sec_code?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Supply the DB password via the DB_PASSWORD environment variable (no committed value).
# The previously committed password remains in git history and must be rotated.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
# mybatis SQL log
logging.level.org.joychou.mapper=debug

# Spring Boot Actuator Config
management.security.enabled=false

# logging.config=classpath:logback-online.xml

# jsonp callback parameter
joychou.business.callback = callback_


### check referer configuration begins ###
joychou.security.referer.enabled = false
joychou.security.referer.host = joychou.org, joychou.com
# Only support ant url style.
joychou.security.referer.uri = /jsonp/**
### check referer configuration ends ###


### csrf configuration begins ###
# csrf token check
joychou.security.csrf.enabled = false
# URI without CSRF check (only support ANT url format)
joychou.security.csrf.exclude.url = /xxe/**, /fastjson/**, /xstream/**, /ssrf/**, /deserialize/**
# method for CSRF check
joychou.security.csrf.method = POST
### csrf configuration ends ###


### jsonp configuration begins ###
# auto convert json to jsonp
# referer check
joychou.security.jsonp.referer.check.enabled = true
joychou.security.jsonp.callback = callback, _callback
### jsonp configuration ends ###


### cors configuration begins ###
# Exact origins (scheme://host[:port]) allowed to read cross-origin responses. No wildcard / sub domain patterns.
joychou.security.cors.allowed.origins = https://joychou.org, https://www.joychou.org, https://joychou.com, https://www.joychou.com, https://test.joychou.org, http://localhost:8080
### cors configuration ends ###

### redirect configuration begins ###
# Constant redirect destinations (absolute http(s) urls or same-site paths). A request value is only an exact-match key.
joychou.security.redirect.allowed.urls = /, /index, /urlRedirect/test, https://joychou.org/, https://www.joychou.org/, https://joychou.com/, https://www.joychou.com/, https://test.joychou.org/, http://localhost:8080/
### redirect configuration ends ###

### jdbc configuration begins ###
# Constant JDBC endpoints (jdbc:<subprotocol>://host[:port]/database). A request value is only an exact-match key.
joychou.security.jdbc.allowed.urls = jdbc:postgresql://www.joychou.org:5432/test, jdbc:db2://www.joychou.org:50000/test
### jdbc configuration ends ###

# swagger
swagger.enable = true


### no need to login page begins ###
joychou.no.need.login.url = /css/**, /js/**, /xxe/**, /rce/**, /deserialize/**, /test/**, /ws/**
### no need to login page ends ###



# http header max size
#server.max-http-header-size=30000

# Access key credentials are loaded from the environment (no committed value).
# The previously committed key pair remains in git history and must be rotated (revoked/reissued).
jsc.accessKey.id=${JSC_ACCESS_KEY_ID:}
jsc.accessKey.secret=${JSC_ACCESS_KEY_SECRET:}

spring.datasource.url=jdbc:mysql://localhost:3306/java_sec_code?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Supply via env var JSC_DB_PASSWORD (the previously committed password must be rotated; it remains in git history)
spring.datasource.password=${JSC_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
# mybatis SQL log
logging.level.org.joychou.mapper=debug

# Spring Boot Actuator Config
management.security.enabled=false

# logging.config=classpath:logback-online.xml

# jsonp callback parameter
joychou.business.callback = callback_


### check referer configuration begins ###
joychou.security.referer.enabled = false
joychou.security.referer.host = joychou.org, joychou.com
# Only support ant url style.
joychou.security.referer.uri = /jsonp/**
### check referer configuration ends ###


### csrf configuration begins ###
# csrf token check
joychou.security.csrf.enabled = false
# URI without CSRF check (only support ANT url format)
joychou.security.csrf.exclude.url = /xxe/**, /fastjson/**, /xstream/**, /ssrf/**, /deserialize/**
# method for CSRF check
joychou.security.csrf.method = POST
### csrf configuration ends ###


### cors configuration begins ###
# Exact-match CORS origin allowlist (scheme://host[:port]); no wildcards. Credentialed CORS is only granted to these.
joychou.security.cors.allowed.origins = https://joychou.com, https://joychou.org, https://test.joychou.org, http://localhost:8080
### cors configuration ends ###


### outbound request (SSRF) and jdbc target allowlists begin ###
# Hosts the application may request. Only these configured host strings are ever used to build outgoing urls.
joychou.security.ssrf.outbound.hosts = img.alicdn.com, www.baidu.com, joychou.org, www.joychou.org, test.joychou.org
# Selectable jdbc targets as name=jdbc-url. The request only selects a name; the url is always the configured one.
joychou.jdbc.postgresql.targets = default=jdbc:postgresql://localhost:5432/postgres
joychou.jdbc.db2.targets = default=jdbc:db2://localhost:50000/sample
joychou.jdbc.username =
# Supply via env var JSC_JDBC_PASSWORD
joychou.jdbc.password = ${JSC_JDBC_PASSWORD:}
### outbound request (SSRF) and jdbc target allowlists end ###


### jsonp configuration begins ###
# auto convert json to jsonp
# referer check
joychou.security.jsonp.referer.check.enabled = true
joychou.security.jsonp.callback = callback, _callback
### jsonp configuration ends ###

# swagger
swagger.enable = true


### no need to login page begins ###
joychou.no.need.login.url = /css/**, /js/**, /xxe/**, /rce/**, /deserialize/**, /test/**, /ws/**
### no need to login page ends ###



### real client IP configuration begins ###
# Forwarded client IP is resolved by Tomcat's RemoteIpValve, which only honours the header when the
# direct peer matches internal-proxies (loopback only here; widen to your reverse proxy IPs as needed).
# Controllers must use request.getRemoteAddr() and never read X-Forwarded-For / X-Real-IP themselves.
server.tomcat.remote-ip-header=X-Forwarded-For
server.tomcat.internal-proxies=127(?:[.][0-9]{1,3}){3}|0:0:0:0:0:0:0:1|::1
### real client IP configuration ends ###


# http header max size
#server.max-http-header-size=30000

jsc.accessKey.id=LTAI5tSAEPX3Z5N2Yt8ogc2y
# Supply via env var JSC_ACCESS_KEY_SECRET (the previously committed key must be revoked/rotated; it remains in git history)
jsc.accessKey.secret=${JSC_ACCESS_KEY_SECRET:}